version: '3.8'

services:
  # Redis Database Service
  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    restart: always

  # Backend Service
  backend:
    build:
      context: ./backend # Path to your backend folder
      dockerfile: Dockerfile
    container_name: express_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    restart: always

  # Frontend Service
  frontend:
    build:
      context: ./frontend # Path to your frontend folder
      dockerfile: Dockerfile
    container_name: vite_frontend
    ports:
      - "5173:80" # Maps Nginx port 80 to localhost:5173
    depends_on:
      - backend
    restart: always